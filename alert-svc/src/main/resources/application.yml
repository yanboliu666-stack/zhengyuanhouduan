server:
  port: 8097

spring:
  application:
    name: alert-svc
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_intersection
    username: smart
    password: smart123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

management:
  endpoints:
    web:
      exposure:
        include: '*'