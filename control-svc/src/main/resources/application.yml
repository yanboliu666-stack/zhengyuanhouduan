server:
  port: 8094

spring:
  application:
    name: control-svc
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/smart_intersection
    username: smart
    password: smart123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis123
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

management:
  endpoints:
    web:
      exposure:
        include: '*'