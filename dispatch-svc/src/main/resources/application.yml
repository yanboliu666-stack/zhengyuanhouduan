server:
  port: 8095

spring:
  application:
    name: dispatch-svc
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_intersection
    username: smart
    password: smart123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123

mqtt:
  broker: tcp://localhost:1883
  server-uris: tcp://localhost:1883
  client-id: dispatch-service-publisher
  username: admin
  password: publicpassword

management:
  endpoints:
    web:
      exposure:
        include: '*'