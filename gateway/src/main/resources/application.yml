server:
  port: 9090

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: auth-svc
          uri: lb://auth-svc
          predicates:
            - Path=/api/v1/auth/**

        - id: device-svc
          uri: lb://device-svc
          predicates:
            - Path=/api/v1/intersections/**,/api/v1/devices/**,/api/v1/lanes/**

        - id: control-svc-route
          uri: lb://control-svc
          predicates:
            - Path=/api/v1/control/**

        # 核心服务：包含实时状态、数字孪生、告警、以及 MQTT 边缘下发
        - id: ingest-svc
          uri: lb://ingest-svc
          predicates:
            - Path=/api/v1/realtime/**,/api/v1/ingest/**,/api/v1/analytics/**,/api/v1/alerts/**,/api/v1/dispatch/**